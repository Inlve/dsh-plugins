name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check packages/web-fetch-clash/index.js
      - name: Unit tests
        run: node --test packages/web-fetch-clash/test/basic.test.mjs
